# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-contract-xml-schema"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-contract-xml-schema"
description = "XML content contract: well-formed always, conforming to a bound XML Schema when a Location names one. A xmip-core-contract technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Contract trait and its value types live there.
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }

# The one real parser. Well-formedness is a genuine parse — entities, nesting,
# namespaces — not a tag-balancing scan, and the schema is itself an XML
# document read through the same parser. Read-only tree, no unsafe, no
# further dependencies of note.
roxmltree = "0.21"

[dev-dependencies]
# The parent's Stream fixture, for the tests only (ADR-0044).
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main", features = ["test-support"] }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
